version: 2

updates:
  # The workflows above pin actions by major version; this keeps them current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - dependencies

  # docfleet has no runtime dependencies, so this only ever moves the dev
  # extra (pytest). It stays enabled so that changes here are noticed.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    labels:
      - dependencies
